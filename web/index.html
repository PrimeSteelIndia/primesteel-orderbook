<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b3554">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Order Book</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="worker">
  <header class="topbar">
    <div class="brand-mark"></div>
    <div style="flex:1;min-width:0">
      <div class="brand-name" id="businessName"></div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
    <span class="conn" id="conn"><span class="dot"></span>Connecting</span>
  </header>

  <main id="view"></main>
  <div id="foot"></div>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="new" aria-selected="true">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      New order
    </button>
    <button type="button" data-tab="orders" aria-selected="false">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
      Orders
      <span class="count hidden" id="pendingBadge">0</span>
    </button>
  </nav>

  <div id="toastRoot"></div>

  <script src="/ui.js"></script>
  <script src="/share.js"></script>
  <script src="/share_pdf.js"></script>
  <script src="/share_ui.js"></script>
  <script src="/worker.js"></script>
  <script>
    document.querySelectorAll('.tabbar button').forEach(function (b) {
      b.addEventListener('click', function () {
        location.hash = b.dataset.tab === 'orders' ? '#/orders' : '#/';
      });
    });
  </script>
</body>
</html>
