<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b3554">
  <title>Prime Steel - Office</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/admin-manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="admin">
  <div id="loginGate" class="login-screen hidden"></div>

  <div id="app" class="hidden">
    <header class="admin-top">
      <div class="admin-top-inner">
        <div class="admin-brand">
          <img src="/logo.png" alt="Prime Steel" style="height:34px;width:auto;max-width:120px;object-fit:contain;display:block;margin-right:8px;">
          <div>
            <div class="brand-name" id="businessName">Prime Steel</div>
            <div class="brand-sub" style="font-size:12px;color:#64748b;font-weight:500">Office</div>
          </div>
        </div>

        <nav class="admin-nav" aria-label="Sections">
          <button type="button" data-tab="orders" aria-current="page">Orders</button>
          <button type="button" data-tab="items">Rate list</button>
          <button type="button" data-tab="customers">Customers</button>
          <button type="button" data-tab="settings">Settings</button>
        </nav>

        <span class="spacer"></span>

        <button class="addr-chip" id="addrBtn" title="Addresses for phones and the other computer">
          <svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5a10 10 0 0114 0M8.5 16a5.5 5.5 0 017 0"/><path d="M2 9a15 15 0 0120 0"/><circle cx="12" cy="20" r="1"/></svg>
          Open on phone
        </button>

        <button class="btn btn-sm btn-ghost" id="lockBtn" title="Lock admin dashboard" style="margin-left:8px;color:#64748b">
          <svg class="i i-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Lock
        </button>
      </div>
    </header>

    <main class="admin-main" id="adminMain"></main>
  </div>

  <div id="toastRoot"></div>

  <script src="/ui.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
